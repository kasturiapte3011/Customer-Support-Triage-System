version: "3.9"

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    ports:
      - "8001:8000"
    command: >
      --model mistralai/Mistral-7B-Instruct-v0.2
      --trust-remote-code
      --dtype float16
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    ports:
      - "8000:8000"
    depends_on:
      - vllm
    volumes:
      - ./data:/app/data

  streamlit-customer:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit_customer
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: >
      streamlit run ui/customer_app.py
      --server.port=8501
      --server.address=0.0.0.0

  streamlit-admin:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit_admin
    ports:
      - "8502:8501"
    depends_on:
      - api
    command: >
      streamlit run ui/admin_app.py
      --server.port=8501
      --server.address=0.0.0.0
